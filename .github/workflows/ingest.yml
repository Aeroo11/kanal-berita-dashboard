name: ingest

# Hourly, because an RSS feed is a sliding window of its last 25-100 items:
# there is no archive endpoint, so an hour that is not captured is gone for
# good. This workflow is the reason the dataset exists at all, and it was
# switched on before the rest of the pipeline was built.
on:
  schedule:
    - cron: "7 * * * *" # :07 past the hour — off the busy top-of-hour slot
  workflow_dispatch: # manual trigger, for backfilling after an outage

# Never run two cycles at once. Overlapping runs would each read the partition,
# both decide the same articles are new, and both write them.
concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      # The landing zone lives on its own orphan branch, so the code history
      # stays readable while the data still accumulates in the same repository.
      # Mounting it at ./data means the ingest cycle sees every previous run's
      # articles and feed state — which is what makes deduplication and
      # conditional requests work across runs rather than only within one.
      - name: Mount the data branch at ./data
        run: |
          set -euo pipefail
          git config user.name "kanal-bot"
          git config user.email "kanal-bot@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git worktree add data origin/data
            echo "mounted existing data branch"
          else
            # First ever run. --orphan gives a worktree on a branch with no
            # history, so the data branch never carries a copy of the code.
            git worktree add --orphan -b data data
            echo "created the data branch"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Poll every feed
        id: poll
        # Let a partial cycle reach the steps that record and commit it. The job
        # is failed explicitly at the end instead, so the red signal survives
        # without throwing away the diagnosis that explains it.
        continue-on-error: true
        run: |
          # pipefail is not optional here. Without it bash reports the exit
          # status of `tee`, which always succeeds, so a cycle that lost an
          # entire publisher would still be reported as green. That is exactly
          # what happened on the first runs: CNN returned nothing, `kanal ingest`
          # exited 1 as designed, and the pipe swallowed it.
          set -o pipefail
          uv run kanal ingest 2>&1 | tee cycle.log

      # Written into the data branch, not only into the job summary.
      #
      # Workflow logs need a signed-in session to read and expire on their own
      # schedule, which meant the one question that mattered — *why* does CNN
      # return nothing from a runner — was unanswerable from outside GitHub's UI.
      # A pipeline that cannot explain its own failures to someone holding a git
      # clone is missing a piece.
      - name: Record the cycle on the data branch
        if: always()
        run: |
          set -euo pipefail
          mkdir -p data/logs
          stamp=$(date -u '+%Y-%m-%dT%H%M%SZ')
          cp cycle.log "data/logs/cycle-${stamp}.log" 2>/dev/null || true
          # A rolling tail, so the recent history is one file to read rather than
          # a directory to sift.
          {
            echo "=== ${stamp} ==="
            cat cycle.log 2>/dev/null || echo "(cycle produced no output)"
            echo
          } >> data/logs/recent.log
          # Keep the tail bounded; the per-cycle files hold the full record.
          tail -n 400 data/logs/recent.log > data/logs/recent.log.tmp
          mv data/logs/recent.log.tmp data/logs/recent.log
          # And prune the per-cycle files to the last few days.
          ls -1t data/logs/cycle-*.log 2>/dev/null | tail -n +73 | xargs -r rm -f

      - name: Summarise the cycle
        if: always()
        run: |
          {
            echo '### Ingestion cycle'
            echo '```'
            cat cycle.log || echo "(no log — the cycle failed before reporting)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Committed even when the poll step failed: a partial cycle still landed
      # real articles, and discarding them would lose the hour permanently.
      - name: Commit what landed
        if: always()
        working-directory: data
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new this cycle"
            exit 0
          fi
          # Distinct articles, not raw lines. Counting lines overstated the
          # dataset by 39% while articles were being re-landed across day
          # partitions, and a commit log that inflates its own numbers is worse
          # than one that omits them.
          lines=$(find raw -name '*.jsonl' -exec cat {} + 2>/dev/null | wc -l || echo 0)
          articles=$(find raw -name '*.jsonl' -exec cat {} + 2>/dev/null \
            | grep -o '"article_key": *"[^"]*"' | sort -u | wc -l || echo 0)
          git commit -m "ingest $(date -u '+%Y-%m-%d %H:%M') UTC — ${articles} articles (${lines} lines)"
          git push origin HEAD:data

      # The last word on whether this cycle was acceptable. `kanal ingest` exits
      # non-zero when a whole publisher produced nothing usable, and that has to
      # end up as a red run — but only after the diagnosis has been recorded and
      # the articles that *did* land have been committed. An hour of data is not
      # worth discarding to make a status code arrive sooner.
      - name: Fail the run if a publisher went dark
        if: steps.poll.outcome == 'failure'
        run: |
          echo "::error::A publisher produced no usable response this cycle — see the summary above and data/logs/recent.log on the data branch."
          exit 1
