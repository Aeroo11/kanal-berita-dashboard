name: Build and optionally deploy the API

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified API and model to Hugging Face Spaces
        type: boolean
        default: false
      space:
        description: Target Space (owner/name)
        type: string
        default: aeroo11/kanal

permissions:
  contents: read

concurrency:
  group: deploy-space-${{ inputs.space }}

env:
  DATASET_URL: https://huggingface.co/datasets/aeroo11/kanal-berita/resolve/d5243435fafd704b3620a40981d0da430693cc86/articles.parquet
  DATASET_SHA256: e6e7af38cef3d97dee9d539a2f364dcd8b10a8cd39d94709d19c5fe54d138581

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.6"

      - name: Train from the published snapshot
        run: |
          mkdir -p data/export
          curl --fail --location --retry 3 "$DATASET_URL" -o data/export/articles.parquet
          printf '%s  data/export/articles.parquet\n' "$DATASET_SHA256" | sha256sum --check
          uv sync --locked --no-dev
          uv run --no-sync kanal train --dataset data/export/articles.parquet --report-dir data/evaluation
          uv run --no-sync kanal champion

      - name: Save the evaluation and split manifest
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: kanal-evaluation
          path: data/evaluation/

      - name: Build and smoke-test the serving image
        run: |
          docker build -t kanal-api .
          container=$(docker run --detach --publish 127.0.0.1:7860:7860 kanal-api)
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          ready=false
          for i in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://127.0.0.1:7860/health -o /tmp/health.json; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:7860/predict \
            -H 'content-type: application/json' \
            -d '{"articles":[{"title":"Persib melaju ke final setelah menang lewat adu penalti"}]}' \
            -o /tmp/prediction.json
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/health.json").read_text())
          prediction = json.loads(Path("/tmp/prediction.json").read_text())
          alias = json.loads(Path("data/registry/aliases/champion.json").read_text())
          assert health["status"] == "ok"
          assert prediction["model_id"] == health["model_id"] == alias["artifact_id"]
          assert prediction["predictions"][0]["kanal"] in health["classes"]
          print(json.dumps(prediction, indent=2))
          PY

      - name: Publish the verified build inputs to the Space
        if: inputs.publish
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ inputs.space }}
        run: |
          if [[ -z "$HF_TOKEN" ]]; then
            echo "::error::Set the HF_TOKEN secret before enabling publish."
            exit 1
          fi
          uv run --no-sync python - <<'PY'
          import os
          import shutil
          import subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from huggingface_hub import HfApi

          space = os.environ["SPACE"]
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)

          with TemporaryDirectory() as directory:
              target = Path(directory)
              tracked = subprocess.check_output(["git", "ls-files", "src"], text=True)
              for name in [".dockerignore", "Dockerfile", "pyproject.toml", "uv.lock", *tracked.splitlines()]:
                  destination = target / name
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(name, destination)
              shutil.copyfile("README_SPACE.md", target / "README.md")
              shutil.copytree("data/registry", target / "data/registry", ignore=shutil.ignore_patterns("_staging"))
              api.upload_folder(
                  repo_id=space, repo_type="space", folder_path=target,
                  commit_message=f"Serve KANAL from {os.environ['GITHUB_SHA'][:12]}",
              )
          PY
