name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      # The suite never touches the network: feed responses are mocked with
      # respx. A test run that depends on a publisher being up is a test run
      # that fails for reasons unrelated to the code.
      - name: Tests
        run: uv run pytest -v

      # Proves the CLI is wired up on a clean machine, without polling anyone.
      - name: Smoke-test the CLI
        run: uv run kanal status

      # The whole chain, end to end, on synthetic data: fixture → landing zone
      # → DuckDB → dbt models → contracts. CI never touches a publisher, but the
      # fixture reproduces the properties the models care about — CNN's URL
      # leakage, ANTARA's evergreen items, a cross-source duplicate filed under
      # two sections, and a missing timestamp. A fixture that was merely
      # well-formed would pass everything while proving nothing.
      - name: Build the warehouse from a fixture
        run: |
          set -o pipefail
          uv run python scripts/make_fixture.py --out data/raw
          uv run kanal load

      - name: dbt build
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        run: |
          set -o pipefail
          uv run dbt build --no-partial-parse

      # A second load must be a no-op. Asserting it here means the idempotency
      # claim is checked against a real DuckDB file on every push, not only in
      # unit tests against a temporary directory.
      - name: Assert the load is idempotent
        run: |
          set -o pipefail
          uv run kanal load | tee second-load.log
          grep -q "0 rows added" second-load.log

      # Catches a broken code location before it reaches a run, and — more
      # usefully — catches the asset graph silently splitting in two. dbt names
      # its source `kanal.raw_articles`, which becomes the key `kanal/raw_articles`
      # while the Python asset that writes that table is keyed `raw_articles`. Both
      # nodes exist, nothing connects them, every asset materialises and every
      # check passes, and the one reason Dagster is here — tracing a number in a
      # mart back to the feed it came from — quietly stops working.
      - name: Validate the Dagster code location
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        run: uv run dagster definitions validate -m kanal.orchestration.definitions

      - name: Assert the asset graph is connected end to end
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
        run: uv run python scripts/check_lineage.py

      # Runs the whole transformation half through the orchestrator, so the
      # Dagster wiring is exercised rather than merely parsed.
      - name: Execute the transform job
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
          DAGSTER_HOME: ${{ runner.temp }}/dagster
        run: |
          set -o pipefail
          mkdir -p "$DAGSTER_HOME" && touch "$DAGSTER_HOME/dagster.yaml"
          uv run dagster job execute -m kanal.orchestration.definitions -j transform_job
