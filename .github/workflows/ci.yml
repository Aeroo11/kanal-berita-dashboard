name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      # The suite never touches the network: feed responses are mocked with
      # respx. A test run that depends on a publisher being up is a test run
      # that fails for reasons unrelated to the code.
      - name: Tests
        run: uv run pytest -v

      # Proves the CLI is wired up on a clean machine, without polling anyone.
      - name: Smoke-test the CLI
        run: uv run kanal status
