[project]
name = "kanal"
version = "0.1.0"
description = "A model-lifecycle platform for Indonesian news classification: find the best model, deploy it, keep it honest."
readme = "README.md"
# 3.12, matching what every CI workflow already pins and what the lockfile
# resolves to. The declaration said 3.11 while nothing ran on it, which meant
# mypy was type-checking against a version the project never used — and numpy
# 2.x stubs, which use `type` statements, fail to parse under it.
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Efan Ramdhani" }]

dependencies = [
    # Ingestion. Deliberately plain — see docs/decisions/ADR-002.
    "httpx>=0.28",
    "feedparser>=6.0.11",
    # Config
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    # Warehouse
    "duckdb>=1.1",
    "huggingface-hub>=0.27",
    # Evaluation. numpy is for the array arithmetic only — the statistics
    # themselves (macro-F1, ECE, paired bootstrap, McNemar) are written out in
    # kanal.eval, for the reason in ADR-002. Hand-writing MinHash was defensible
    # because the algorithm is the demonstration; hand-writing a dot product is
    # not.
    "numpy>=2.0",
    # TF-IDF and LinearSVC. The classifier is not what this project is
    # demonstrating — the harness around it is — so the standard implementation
    # is the right call here, unlike MinHash or the significance tests.
    "scikit-learn>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.14",
    "respx>=0.22",          # httpx mocking, so ingestion tests never hit the network
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "dagster>=1.9",
    "dagster-dbt>=0.25",
    "dagster-webserver>=1.9",
]

[project.scripts]
kanal = "kanal.cli:main"

# Lets `dagster dev` find the code location without a -m flag every time.
[tool.dagster]
module_name = "kanal.orchestration.definitions"
code_location_name = "kanal"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kanal"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# RUF001/2/3 flag characters that look like ASCII but are not. Usually a good
# catch; here they are load-bearing. Indonesian publishers separate their
# boilerplate with en and em dashes ("Liputan6.com, Jakarta – "), and the
# patterns that strip that boilerplate have to match the real characters.
# Listing them is narrower than switching the rules off.
allowed-confusables = ["–", "—"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/kanal"]

# feedparser ships no type information. Its return shape is genuinely dynamic
# (feeds carry whatever elements the publisher chose), so `parse.py` treats
# every field as untrusted and validates it — which is what the parse-failure
# accounting is for.
[[tool.mypy.overrides]]
module = "feedparser.*"
ignore_missing_imports = true

# scikit-learn ships no py.typed marker.
#
# The suppression sits on the *importing* module rather than on `sklearn.*`,
# because that is where mypy reports import-untyped — and putting it here keeps
# the exemption to the single file that touches sklearn instead of granting it
# repository-wide.
#
# The boundary is narrow by design: tfidf.py converts everything crossing back
# out into np.ndarray and then into the Prediction dataclass, so untyped values
# never reach the evaluation code, which is where a wrong type would produce a
# wrong number rather than a crash.
[[tool.mypy.overrides]]
module = "kanal.models.tfidf"
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
